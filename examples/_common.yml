project:
  pre-render: _extensions/loimoi/pre-render.ts
  render:
    - c/**/*.qmd

lang: en

# Scaffold and solution marked, e.g. in the preview: a line on the left, labelled in the language of the page (inline,
# since Quarto does not copy a css file outside the project)
format:
  html:
    include-in-header:
      text: |
        <style>
        .lm-solution, .lm-scaffold { border-left: 3px solid var(--lm-color); padding-left: 0.8em; margin-bottom: 1rem; }
        .lm-solution { --lm-color: #4a8c4a; }
        .lm-scaffold { --lm-color: #107895; }
        .lm-solution::before, .lm-scaffold::before { display: block; font-size: 0.85em; font-weight: 600; color: var(--lm-color); }
        .lm-solution::before { content: "Solution"; }
        .lm-scaffold::before { content: "Scaffold"; }
        :lang(de) .lm-solution::before { content: "Lösung"; }
        :lang(de) .lm-scaffold::before { content: "Gerüst"; }
        </style>
